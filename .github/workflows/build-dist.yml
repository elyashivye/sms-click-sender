name: Rebuild dist/

# Hostinger's Node.js Git deployment only runs `npm install` + the configured
# entry file - there's no separate "build command" step. So instead of
# relying on the host to build the frontend, dist/ is committed to the repo
# and this workflow keeps it in sync automatically on every push that
# changes source files. paths-ignore on dist/ itself prevents this from
# re-triggering on its own commits.

on:
  push:
    branches:
      - main
      - claude/gallant-dirac-lk7nbw
    paths-ignore:
      - "dist/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Commit dist/ if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist/ unchanged, nothing to commit"
          else
            git commit -m "chore: rebuild dist/ [skip ci]"
            git push
          fi
