name: Build and publish desktop app

# Builds the downloadable Electron app for Windows/Mac/Linux and publishes
# the installers to a single rolling GitHub Release (tag: desktop-app), so
# the website's download links never need to change between versions (the
# release's asset filenames are fixed - see build.*.artifactName in
# package.json - and the links use GitHub's generic .../releases/latest/
# endpoint, which resolves to whichever release is newest and published
# regardless of its tag name).

on:
  push:
    branches:
      - main
      - claude/gallant-dirac-lk7nbw
    paths-ignore:
      - "dist/**"
  workflow_dispatch:

# Two pushes in quick succession must never both reach the publish job at
# once: their "gh release upload --clobber" calls raced on the same asset
# name once ("ReleaseAsset.name already exists", HTTP 422) even though
# --clobber is supposed to replace it - cancelling the superseded run
# before it starts publishing removes the race entirely.
concurrency:
  group: build-desktop-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          # No code-signing certificate is configured - build unsigned
          # installers rather than have electron-builder try (and fail) to
          # find one. Users will see an "unknown publisher" warning on first
          # run, documented on the website's download page.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Uses GitHub's own gh CLI (preinstalled on every runner) instead of a
      # third-party action: uploading ~130MB installers to a just-created
      # release via softprops/action-gh-release kept racing GitHub's own
      # asset storage (its log even said "not yet discoverable by tag ...,
      # retrying") - concurrent uploads failed with a generic "Error saving
      # asset", and worse, a failed run left the release permanently stuck
      # as an undiscoverable draft even with draft:false passed explicitly.
      # gh release upload sends files one at a time against the same code
      # path `gh` itself uses, which is far more battle-tested for this.
      #
      # Create-only-if-missing on purpose, never delete+recreate: the
      # Android app (build-android-app.yml) uploads its own APK to this
      # same release independently, and a delete+recreate here would wipe
      # that file out if the two workflows ever run from the same push.
      - name: Publish installers to the desktop-app release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"

          if ! gh release view desktop-app --repo "$REPO" >/dev/null 2>&1; then
            gh release create desktop-app --repo "$REPO" \
              --title "הגרסה העדכנית" \
              --notes "נבנה אוטומטית מהקוד העדכני. קישורי ההורדה באתר תמיד מצביעים לגרסה הזו, ולא צריך לעדכן אותם בעצמכם." \
              --latest
          fi

          gh release upload desktop-app --repo "$REPO" --clobber \
            artifacts/installer-windows-latest/*.exe \
            artifacts/installer-macos-latest/*.dmg \
            artifacts/installer-ubuntu-latest/*.AppImage
